filebeat.inputs:
  - type: filestream
    id: cowrie
    paths:
      - /var/log/cowrie/cowrie.json*
    parsers:
      - ndjson:
          target: ""
          add_error_key: true
    processors:
      - rename:
          fields:
            - from: "input"
              to: "command_input"
          ignore_missing: true
          fail_on_error: false

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "cowrie-%{+yyyy.MM.dd}"
  pipeline: "cowrie-geoip"

setup.template.enabled: false
setup.ilm.enabled: false
